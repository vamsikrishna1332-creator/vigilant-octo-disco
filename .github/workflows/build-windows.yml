name: Build Windows App using Wine compatibility layer

on:
  push:
    tags:
      - 'v2.0.0'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and release Electron app
        uses: samuelmeuli/action-electron-builder@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
        env:
          PACKAGE_NAME: launchdesk
          PACKAGE_VERSION: "2.0.0"
